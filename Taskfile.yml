# github.com/go-task/task

version: '3'

vars:
  BINARY_NAME: kubemq
  # The version is the git tag: v2.4.0 on a tagged commit, v2.4.0-3-gabc1234
  # after it, with -dirty for uncommitted changes. To release, run
  # `task release VERSION=v2.5.0`, which creates the tag.
  VERSION:
    sh: git describe --tags --always --dirty

tasks:
  check_update:
    cmds:
      - go list -u -m -mod=mod -json all | go-mod-outdated -update -direct
  lint:
    cmds:
      - golangci-lint run --disable gocritic --enable misspell --disable gosec
  default:
    env:
      DEV: true
    cmds:
      - go build -o "{{.BINARY_NAME}}.exe" -ldflags "-X 'main.version={{.VERSION}}'"
      - kubemq.exe server
  web:
    dir: web
    cmds:
      - npm ci
      - npm run build
  build:
    cmds:
      - go build -o "{{.BINARY_NAME}}" -ldflags "-X 'main.version={{.VERSION}}'" .
  build_all:
    cmds:
      - task: web
      - task: build
  # Runs test/smoke-js against a running server: task smoke -- [host:port]
  # (default localhost:50000). Set KUBEMQ_TOKEN when authentication is on.
  smoke:
    dir: test/smoke-js
    cmds:
      - npm ci
      - node smoke.mjs {{.CLI_ARGS}}
  # Runs test/bench against a running server: task bench -- -addr localhost:50000
  bench:
    cmds:
      - go run ./test/bench {{.CLI_ARGS}}
  goreleaser:
    cmds:
      - goreleaser --snapshot --skip-publish --rm-dist
  rundocker:

    cmds:
      - docker run -it --rm -p 8080:8080 -p 50000:50000 -p 9090:9090 kubemq/{{.BINARY_NAME}}-community:{{.VERSION}}
  docker:
    env:
      GOOS: linux
      GOARCH: amd64
    cmds:
      - docker build --build-arg VERSION={{.VERSION}} . -t kubemq/{{.BINARY_NAME}}-community:{{.VERSION}}
      - docker tag kubemq/{{.BINARY_NAME}}-community:{{.VERSION}} kubemq/{{.BINARY_NAME}}-community:latest
  docker_push:
    cmds:
      - docker push kubemq/{{.BINARY_NAME}}-community:{{.VERSION}}
      - docker push kubemq/{{.BINARY_NAME}}-community:latest
  release:
    cmds:
      - task: tag
      - task: docker_buildx
      - task: goreleaser
  docker_buildx:
    cmds:
      - docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION={{.VERSION}} . -t kubemq/{{.BINARY_NAME}}-community:{{.VERSION}} --push
      - docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION={{.VERSION}} . -t kubemq/{{.BINARY_NAME}}-community:latest --push
      - docker pull kubemq/{{.BINARY_NAME}}-community:{{.VERSION}}
      - docker pull kubemq/{{.BINARY_NAME}}-community:latest
  tag:
    preconditions:
      - sh: echo "{{.VERSION}}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
        msg: "Pass the new release version: task release VERSION=vX.Y.Z (got {{.VERSION}})"
      - sh: git diff --quiet HEAD
        msg: "Uncommitted changes: commit before tagging a release."
    cmds:
      - git tag -a {{.VERSION}} -m {{.VERSION}}
      - git push origin main --tags
